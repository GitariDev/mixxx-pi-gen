<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mix Pi screen comparison</title><style>
:root{color-scheme:light dark}html,body{margin:0;padding:0;background:transparent;font-family:var(--font-sans,Arial,sans-serif);color:var(--foreground,#eee)}*{box-sizing:border-box}#review{max-width:800px;margin:auto}nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}button{font:inherit;font-size:12px;min-height:34px;padding:6px 10px;border:1px solid var(--border,#666);border-radius:4px;background:var(--secondary,#252a31);color:var(--foreground,#eee);cursor:pointer}button[aria-pressed=true]{background:var(--primary,#eee);color:var(--primary-foreground,#111);border-color:var(--primary,#eee)}button:focus-visible{outline:2px solid var(--ring,#8cf);outline-offset:2px}.screen{width:100%;aspect-ratio:5/3;background:#000}.screen img{width:100%;height:100%;display:block;object-fit:contain}.screen img[hidden]{display:none}p{font-size:12px;line-height:1.5;margin:9px 0 0;color:var(--foreground,#eee)}
</style></head><body><div id="review"><nav aria-label="Compare captured prototype screens"><button data-screen="perform" aria-pressed="true">Perform</button><button data-screen="loops" aria-pressed="false">Loops</button><button data-screen="settings" aria-pressed="false">Settings</button><button data-screen="browse" aria-pressed="false">Browse</button><button data-screen="sources" aria-pressed="false">Sources</button><button data-screen="fx" aria-pressed="false">FX</button><button data-screen="original" aria-pressed="false">Pi today</button></nav><div class="screen"><img data-view="perform" src="/Users/gitaritirima/Documents/Workspace/Personal Projects/mixxx-pi-gen/tools/pioneer-prototype/qa/perform.png" alt="Rebuilt Perform view at the exact Pi resolution"><img data-view="loops" src="/Users/gitaritirima/Documents/Workspace/Personal Projects/mixxx-pi-gen/tools/pioneer-prototype/qa/loops-active.png" alt="Loop intervals, half or double length and exit loop above the decks" hidden><img data-view="settings" src="/Users/gitaritirima/Documents/Workspace/Personal Projects/mixxx-pi-gen/tools/pioneer-prototype/qa/settings.png" alt="Settings above the deck information, overview waveforms and transport controls" hidden><img data-view="browse" src="/Users/gitaritirima/Documents/Workspace/Personal Projects/mixxx-pi-gen/tools/pioneer-prototype/qa/browse.png" alt="Browse with a source sidebar and compact decks" hidden><img data-view="sources" src="/Users/gitaritirima/Documents/Workspace/Personal Projects/mixxx-pi-gen/tools/pioneer-prototype/qa/sources.png" alt="Source multi-selection and default source" hidden><img data-view="fx" src="/Users/gitaritirima/Documents/Workspace/Personal Projects/mixxx-pi-gen/tools/pioneer-prototype/qa/fx.png" alt="Three Beat FX slots and deck or master routing" hidden><img data-view="original" src="/Users/gitaritirima/Documents/Workspace/Personal Projects/mixxx-pi-gen/tools/pioneer-prototype/reference/pi-perform.png" alt="Original Pi screen from Claude's V3D test" hidden></div><p id="state-caption">Captured from the rebuilt interactive prototype at 800 × 480. Select a tab to compare layouts; open the prototype linked below to try its controls.</p></div><script>(()=>{const root=document.getElementById('review');root.querySelectorAll('button').forEach(b=>b.onclick=()=>{root.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));root.querySelectorAll('[data-view]').forEach(x=>x.hidden=x.dataset.view!==b.dataset.screen);document.getElementById('state-caption').textContent=b.dataset.screen==='original'?'Actual Pi screenshot from Claude’s V3D test. The proposed view removes the FX sidebar and adds the shared media controls.':'Captured from the rebuilt interactive prototype at 800 × 480. Select a tab to compare layouts; open the prototype linked below to try its controls.'})})();</script></body></html>
