[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "song-dex"
version = "0.1.0"
description = "Local, reviewed music-library cleanup for rekordbox"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "mutagen>=1.47,<2", "httpx>=0.27,<1", "pyrekordbox==0.4.4", "psutil>=6,<8"]

[project.optional-dependencies]
rekordbox = ["sqlcipher3-wheels>=0.5,<1"]
test = ["pytest>=8,<10", "imageio-ffmpeg>=0.6,<1", "ruff>=0.16,<1"]

[project.scripts]
song-dex = "songdex.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
